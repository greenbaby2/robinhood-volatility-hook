name: Mainnet fork rehearsal
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  fork:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node scripts/bootstrap.cjs
      - name: Fork lifecycle and script tests (no broadcast)
        run: node scripts/run-mainnet-fork.cjs
