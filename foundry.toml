[profile.default]
src = "src"
out = "artifacts"
test = "test"
solc_version = "0.8.26"
evm_version = "cancun"
optimizer = true
optimizer_runs = 200
remappings = ["@uniswap/v4-core/=lib/v4-core/", "@openzeppelin/uniswap-hooks/=lib/uniswap-hooks/", "solmate/=lib/v4-core/lib/solmate/", "forge-std/=lib/v4-core/lib/forge-std/src/"]

[fuzz]
runs = 512
